# Audit profile `mock`: docker compose -p lw-audit -f docker-compose.yml -f audit/compose/mock.yml up -d
# Overrides every provider URL so nothing can reach the real platform (CLOUD_BASE_URL -> dead port or mock).
services:
  llmlog:
    image: python:3.12-slim
    command: python /tools/llm_logger.py
    volumes: ["./audit/tools:/tools:ro", "./audit/logs:/logs"]
    environment:
      LOG_FILE: /logs/llm-calls-mock.jsonl
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["9100:9100"]
  backend:
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ""
      CLOUD_API_KEY: ""
      CLOUD_BASE_URL: http://127.0.0.1:9/v1
      MOCK_BASE_URL: http://llmlog:9100/mock/v1
      LOCAL_BASE_URL: http://llmlog:9100/ollama/v1
      LLM_SLOT_FORCE: ""
      LOG_PROMPTS: "false"
      ADMIN_TOKEN: ""
      APP_ENV: development
      SECRET_KEY: audit-dev-904092993002b4db
      CORS_ORIGINS: http://localhost:5174,http://127.0.0.1:5174,http://localhost:8080
      QDRANT_COLLECTION_PREFIX: lw-audit
      LLM_PROVIDER: mock
      EMBED_PROVIDER: same
      OFFLINE_DEMO_MODE: "off"
    depends_on: [llmlog]
  worker:
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ""
      CLOUD_API_KEY: ""
      CLOUD_BASE_URL: http://127.0.0.1:9/v1
      MOCK_BASE_URL: http://llmlog:9100/mock/v1
      LOCAL_BASE_URL: http://llmlog:9100/ollama/v1
      LLM_SLOT_FORCE: ""
      LOG_PROMPTS: "false"
      ADMIN_TOKEN: ""
      APP_ENV: development
      SECRET_KEY: audit-dev-904092993002b4db
      CORS_ORIGINS: http://localhost:5174,http://127.0.0.1:5174,http://localhost:8080
      QDRANT_COLLECTION_PREFIX: lw-audit
      LLM_PROVIDER: mock
      EMBED_PROVIDER: same
      OFFLINE_DEMO_MODE: "off"
  frontend:
    ports: !override ["5174:5173"]
