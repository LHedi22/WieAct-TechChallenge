# Audit profile `local` (own project + ports, runs beside mock): docker compose -p lw-audit-local -f docker-compose.yml -f audit/compose/local.yml up -d
# Overrides every provider URL so nothing can reach the real platform (CLOUD_BASE_URL -> dead port or mock).
services:
  llmlog:
    image: python:3.12-slim
    command: python /tools/llm_logger.py
    volumes: ["./audit/tools:/tools:ro", "./audit/logs:/logs"]
    environment:
      LOG_FILE: /logs/llm-calls-local.jsonl
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: !override ["9101:9100"]
  backend:
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ""
      CLOUD_API_KEY: ""
      CLOUD_BASE_URL: http://127.0.0.1:9/v1
      MOCK_BASE_URL: http://llmlog:9100/mock/v1
      LOCAL_BASE_URL: http://llmlog:9100/ollama/v1
      LLM_SLOT_FORCE: ""
      LOG_PROMPTS: "false"
      ADMIN_TOKEN: ""
      APP_ENV: development
      SECRET_KEY: audit-dev-68d670b877f8469a
      CORS_ORIGINS: http://localhost:5174,http://127.0.0.1:5174,http://localhost:8080
      QDRANT_COLLECTION_PREFIX: lw-audit
      LLM_PROVIDER: local
      EMBED_PROVIDER: local
      OFFLINE_DEMO_MODE: "off"
      LOCAL_MODEL_COMPACT: llama3.2:3b
      LOCAL_MODEL_MID: llama3.1:8b
      LOCAL_EMBEDDING_MODEL: bge-m3
      LOCAL_EMBEDDING_DIM: 1024
      LLM_DISABLE_THINKING: "false"
      LLM_TIMEOUT_S: 300
      LLM_INTERACTIVE_MID_TIMEOUT_S: "300"  # local CPU/GPU: llama3.1:8b needs >45 s per call
    depends_on: [llmlog]
    ports: !override ["18000:8000"]
  worker:
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ""
      CLOUD_API_KEY: ""
      CLOUD_BASE_URL: http://127.0.0.1:9/v1
      MOCK_BASE_URL: http://llmlog:9100/mock/v1
      LOCAL_BASE_URL: http://llmlog:9100/ollama/v1
      LLM_SLOT_FORCE: ""
      LOG_PROMPTS: "false"
      ADMIN_TOKEN: ""
      APP_ENV: development
      SECRET_KEY: audit-dev-68d670b877f8469a
      CORS_ORIGINS: http://localhost:5174,http://127.0.0.1:5174,http://localhost:8080
      QDRANT_COLLECTION_PREFIX: lw-audit
      LLM_PROVIDER: local
      EMBED_PROVIDER: local
      OFFLINE_DEMO_MODE: "off"
      LOCAL_MODEL_COMPACT: llama3.2:3b
      LOCAL_MODEL_MID: llama3.1:8b
      LOCAL_EMBEDDING_MODEL: bge-m3
      LOCAL_EMBEDDING_DIM: 1024
      LLM_DISABLE_THINKING: "false"
      LLM_TIMEOUT_S: 300
      LLM_INTERACTIVE_MID_TIMEOUT_S: "300"  # local CPU/GPU: llama3.1:8b needs >45 s per call
  frontend:
    profiles: ["never"]
  mock-llm:
    profiles: ["never"]
  db:
    ports: !override ["15432:5432"]
  qdrant:
    ports: !override ["16333:6333"]
